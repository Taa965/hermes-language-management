name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","aws","isolated"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Compile scripts
        run: python -m py_compile zero-zero-three-hermes-language-management/scripts/*.py
      - name: Run smoke tests
        run: python tests/smoke_test.py
